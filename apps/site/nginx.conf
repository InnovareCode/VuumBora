# Este arquivo vira /etc/nginx/conf.d/default.conf, que o nginx inclui DENTRO de `http {}` —
# por isso um `map` pode ficar aqui no topo, fora do `server`.

# Cache-Control por caminho. Fica num `map` (e não em `add_header` dentro de cada `location`) de
# propósito: no nginx, um `add_header` num `location` SUBSTITUI todos os `add_header` herdados do
# `server`. E a home passa por um `location` de regex: `/` é atendida por `index index.html`, que
# faz um redirecionamento interno para `/index.html`, e é o `location` de `.html` que responde.
# Com `add_header Cache-Control` ali, a página sairia SEM os cabeçalhos de segurança do `server`
# (mesma armadilha do apps/admin, achado I-8 de docs/revisao-seguranca-s1-rodada2.md).
# Valor vazio = o cabeçalho não é enviado.
#
# `$uri` aqui já é o caminho FINAL (depois do redirecionamento interno, `/` vira /index.html) e
# não inclui a query: o `?v=<hash>` que scripts/carimbar-assets.mjs põe nos links não atrapalha.
map $uri $site_cache_control {
    default       "";
    # O HTML, o CSS e o JS NÃO entram em cache longo de propósito: eles não carregam hash no nome
    # (o `?v=` é da query, não do arquivo), então um cache agressivo faria a próxima publicação
    # demorar a aparecer para quem já visitou.
    ~*\.(?:html|css|js)$                            "public, max-age=300, must-revalidate";
    # As imagens são o peso da página e não mudam de nome, mas também não mudam de conteúdo: um dia
    # de cache é seguro e poupa o 4G do visitante, que é motorista no celular.
    ~*\.(?:ico|png|jpg|jpeg|gif|svg|webp|woff2?)$   "public, max-age=86400";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # ------------------------------------------------------------------
    # Cabeçalhos de segurança do site público (achado M-4 de
    # docs/revisao-seguranca-s1-rodada3.md).
    #
    # TODOS os `add_header` ficam aqui, no nível do `server`, e NENHUM `location` abaixo pode ter
    # `add_header` (ele zeraria estes). O que precisaria de `add_header` num location vai para o
    # `map` lá em cima ou para `default_type`.
    #
    # Só entram cabeçalhos que não alteram o que a página carrega nem como ela se comporta.
    # A CSP do site NÃO está aqui de propósito: o index.html carrega fonte do Google Fonts, chama a
    # API e tem vários atributos `style="..."` embutidos (as partículas animadas); uma CSP sem
    # 'unsafe-inline' para estilo os descartaria SEM erro de build, e o ajuste certo (mover para o
    # CSS ou liberar só isso) precisa de medição no navegador, com o console aberto e o conteúdo
    # real. Fica como pendência (docs/producao-passo-a-passo-dono.md, passo 7); quando entrar,
    # leva `frame-ancestors 'none'` junto.
    # ------------------------------------------------------------------

    # HSTS. O TLS termina no Traefik/Cloudflare, o nginx só vê HTTP; o cabeçalho segue na resposta
    # que chega ao navegador por HTTPS (HSTS recebido por HTTP é ignorado, nada vaza em claro).
    # `always` para sair também em 404/5xx. Um só emissor: o guia (passo 7) manda conferir que o
    # cabeçalho aparece UMA vez — se a Cloudflare tiver o HSTS dela ligado, sai dali e não daqui.
    #
    # max-age=300 (5 min) é de PROPÓSITO: o navegador obedece o prazo inteiro já recebido e não há
    # como desfazer; se o HTTPS do site quebrar (certificado vencido), o visitante ficaria sem
    # acesso por todo o prazo. O guia sobe em etapas: trocar este número e republicar.
    # SEM `includeSubDomains`: este mesmo nginx pode responder também no domínio raiz
    # (vuumbora.com.br), e ali a diretiva cobriria painel., api., admin. e qualquer outro
    # subdomínio, forçando HTTPS em todos pelo prazo inteiro; só vale depois de confirmar que todos
    # têm HTTPS perfeito. SEM `preload`: exige includeSubDomains e 1 ano, e a lista fica gravada
    # nos navegadores (sair dela leva meses).
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Não `no-referrer` (como no admin): o site tem links para fora (wa.me, instagram) e nada
    # sensível na URL. Com esta política, o destino de outro domínio recebe só a origem
    # (https://www.vuumbora.com.br), nunca o caminho, e destino sem HTTPS não recebe nada. É também
    # o padrão dos navegadores atuais; explícito, vale para os antigos.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Ninguém embute o site em <iframe> (clickjacking). O site em si não usa iframe (grep em
    # apps/site/public) e não há motivo para outro site embuti-lo; `frame-ancestors`, o equivalente
    # moderno, vem junto com a CSP (pendência acima).
    add_header X-Frame-Options "DENY" always;
    # Cache-Control calculado pelo `map` do topo (vazio = não envia). Sem `always` de propósito:
    # cache só vale para respostas de sucesso, não para um 404.
    add_header Cache-Control $site_cache_control;

    # Esta página é uma pasta só: um index.html e assets/. Sem build, sem
    # rotas geradas, então a resolução é a mais simples que existe.
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Arquivo com extensão que não existe é 404 de verdade, não index.html com 200 (o fallback do
    # `location /` é para caminho de página; num .js ausente ele serviria HTML como script). Este
    # bloco existe para manter isso: ele não tem `add_header`, o Cache-Control vem do `map` e os
    # cabeçalhos de segurança, do `server`. É também por ele que `/` termina (via /index.html).
    location ~* \.(?:html|css|js|ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        try_files $uri =404;
    }

    # Health check do Easypanel e do rollback: não depende de nenhuma página,
    # só confirma que o nginx está de pé.
    # `default_type` (e não `add_header Content-Type`): add_header aqui anularia os cabeçalhos de
    # segurança do server e ainda duplicaria o Content-Type.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 512;
}
