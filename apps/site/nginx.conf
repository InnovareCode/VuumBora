server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # O export estático (output: 'export', trailingSlash: true) gera
    # index.html por pasta (ex.: out/sobre/index.html). Este bloco resolve
    # tanto "/sobre/" (pasta com index.html, resolvido pelo index nativo do
    # nginx) quanto "/sobre" sem a barra, antes de cair no 404 customizado.
    location / {
        index index.html;
        try_files $uri $uri.html $uri/ $uri/index.html /404.html;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Health check do Easypanel/rollback: não depende de nenhuma página do
    # site, só confirma que o processo nginx está respondendo.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Assets com hash no nome (_next/static/**) são imutáveis — cache
    # agressivo no navegador/CDN. O HTML nunca entra aqui, então uma nova
    # versão publicada sempre pega HTML fresco apontando pros novos hashes.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 512;
}
