server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Fallback de SPA: diferente de apps/site (uma página só, sem rotas),
    # o admin é um React Router de verdade — `/driver-applications`,
    # `/driver-applications/:id` etc. não existem como arquivo no disco.
    # Quem resolve essas rotas é o JavaScript, no navegador; por isso
    # QUALQUER caminho desconhecido cai no mesmo index.html, e o router
    # decide o resto. Sem isto, abrir/recarregar uma rota direta dá 404
    # do próprio Nginx antes do React ter a chance de rodar.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check do Easypanel e do rollback automático: não depende de
    # login nem de a API estar no ar, só confirma que o Nginx está de pé.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # index.html NUNCA entra em cache agressivo: é ele quem referencia os
    # nomes com hash do bundle da vez (ver assets/ abaixo). Um cache longo
    # aqui faria o navegador continuar pedindo um JS/CSS de uma versão
    # antiga, que pode já nem existir mais depois do próximo deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Tudo em assets/ sai do `vite build` com hash de conteúdo no nome
    # (ex.: index-B2sNFOvi.js) — um arquivo com esse nome nunca muda de
    # conteúdo, então pode ficar em cache pelo tempo que for: uma
    # publicação nova gera nomes novos, nunca sobrescreve um hash existente.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 512;
}
