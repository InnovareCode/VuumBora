# Este arquivo vira /etc/nginx/conf.d/default.conf, que o nginx inclui DENTRO de `http {}` —
# por isso um `map` pode ficar aqui no topo, fora do `server`.

# Cache-Control por caminho. Fica num `map` (e não em `add_header` dentro de cada `location`) de
# propósito: no nginx, um `add_header` num `location` SUBSTITUI todos os `add_header` herdados do
# `server`. Se o Cache-Control morasse nos `location`, o index.html — justamente a resposta que
# carrega a CSP — sairia sem os cabeçalhos de segurança (achado I-8 de
# docs/revisao-seguranca-s1-rodada2.md). Valor vazio = o cabeçalho não é enviado.
#
# `$uri` aqui já é o caminho FINAL: depois do `try_files` do fallback de SPA ele vira /index.html.
map $uri $admin_cache_control {
    default       "";
    # index.html NUNCA entra em cache agressivo: é ele quem referencia os nomes com hash do bundle
    # da vez (ver assets/ abaixo). Um cache longo aqui faria o navegador continuar pedindo um JS/CSS
    # de uma versão antiga, que pode já nem existir mais depois do próximo deploy.
    /index.html   "no-cache";
    # Tudo em assets/ sai do `vite build` com hash de conteúdo no nome (ex.: index-B2sNFOvi.js) — um
    # arquivo com esse nome nunca muda de conteúdo, então pode ficar em cache pelo tempo que for: uma
    # publicação nova gera nomes novos, nunca sobrescreve um hash existente.
    ~^/assets/    "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # ------------------------------------------------------------------
    # Cabeçalhos de segurança (achado I-8 da revisão S1, rodada 2).
    #
    # O csrfToken do painel vive em memória JS e a sessão é cookie httpOnly: sem CSP, qualquer XSS
    # (uma dependência de terceiros comprometida, por exemplo) leria o token e dispararia as
    # mutações de dono (trocar o SMTP, aprovar candidatura), e a página poderia ser embutida em
    # quadro de outro site (clickjacking) — por ela passam os códigos de recuperação do 2FA.
    #
    # TODOS os `add_header` ficam aqui, no nível do `server`, e NENHUM `location` abaixo pode ter
    # `add_header` (ele zeraria estes). O que precisaria de `add_header` num location vai para o
    # `map` lá em cima ou para `default_type`.
    #
    # A CSP é montada em pedaços só para dar para comentar cada diretiva (o nginx não aceita string
    # em várias linhas dentro de um `add_header`).
    # ------------------------------------------------------------------
    set $csp "default-src 'self'; ";
    # Só o bundle do próprio painel. Sem 'unsafe-inline' nem 'unsafe-eval': o Vite gera <script
    # type=module src=...> externo, o index.html não tem script embutido e o chunk do QR code
    # (import() dinâmico) também é do próprio domínio.
    set $csp "${csp}script-src 'self'; ";
    # Tailwind sai compilado num .css externo. O Google Fonts entra por @import em global.css
    # (fonte Plus Jakarta Sans): o CSS vem de fonts.googleapis.com e os arquivos de fonte de
    # fonts.gstatic.com. Se a fonte passar a ser servida pelo próprio painel, estes dois hosts saem.
    set $csp "${csp}style-src 'self' https://fonts.googleapis.com; ";
    set $csp "${csp}font-src 'self' https://fonts.gstatic.com; ";
    # `data:` porque o Vite embute imagens < 4 kB como data URI: hoje nada no build usa (a logomarca é
    # arquivo em /assets), mas sem isto a próxima imagem pequena importada sumiria SEM erro de build.
    # O QR do 2FA é SVG desenhado como elementos do DOM, não imagem.
    set $csp "${csp}img-src 'self' data:; ";
    # A API é outro domínio. ⚠ Tem de ser a MESMA origem de VITE_API_BASE_URL no build (ARG do
    # Dockerfile; padrão https://api.vuumbora.com.br). Quem fizer build apontando para outra API
    # precisa trocar esta linha também, senão o navegador bloqueia todas as chamadas.
    set $csp "${csp}connect-src 'self' https://api.vuumbora.com.br; ";
    set $csp "${csp}object-src 'none'; ";
    set $csp "${csp}base-uri 'none'; ";
    set $csp "${csp}form-action 'self'; ";
    # Ninguém embute o painel em <iframe>/<frame>/<object> (clickjacking).
    set $csp "${csp}frame-ancestors 'none'";

    add_header Content-Security-Policy $csp always;
    # Complemento legado do frame-ancestors, para navegador antigo.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Nada de URL do painel no Referer de saída (a fonte do Google, por exemplo).
    add_header Referrer-Policy "no-referrer" always;
    # O painel não usa nenhum destes recursos do aparelho. Clipboard fica de fora de propósito:
    # "copiar códigos de recuperação" usa navigator.clipboard.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
    # Cache-Control calculado pelo `map` do topo (vazio = não envia).
    add_header Cache-Control $admin_cache_control;
    # HSTS (achado M-4 de docs/revisao-seguranca-s1-rodada3.md; I-8 da rodada 2). O TLS termina no
    # Traefik do Easypanel: o nginx só vê HTTP, mas o cabeçalho segue na resposta que o Traefik
    # entrega ao navegador por HTTPS (e navegador ignora HSTS recebido por HTTP, então nada vaza
    # no caminho em claro). `always` para sair também em 404/5xx. Um só emissor: se o Traefik
    # também mandar, o navegador usa só a primeira cópia — o guia (passo 7) manda conferir que
    # aparece UMA vez.
    #
    # max-age=300 (5 min) é de PROPÓSITO: o navegador obedece o prazo inteiro já recebido e não há
    # como desfazer; se o HTTPS do admin quebrar (certificado vencido), o dono ficaria trancado
    # para fora por todo o prazo. O guia sobe em etapas (passo 7): subir o prazo = trocar este
    # número e republicar. Sem `preload` (lista dentro dos navegadores da qual sair leva meses) e
    # sem `includeSubDomains` (aqui só cobriria subdomínios de admin., que não existem; o motivo
    # que pesa está no nginx do site).
    add_header Strict-Transport-Security "max-age=300" always;

    # Fallback de SPA: diferente de apps/site (uma página só, sem rotas),
    # o admin é um React Router de verdade — `/driver-applications`,
    # `/driver-applications/:id` etc. não existem como arquivo no disco.
    # Quem resolve essas rotas é o JavaScript, no navegador; por isso
    # QUALQUER caminho desconhecido cai no mesmo index.html, e o router
    # decide o resto. Sem isto, abrir/recarregar uma rota direta dá 404
    # do próprio Nginx antes do React ter a chance de rodar.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check do Easypanel e do rollback automático: não depende de
    # login nem de a API estar no ar, só confirma que o Nginx está de pé.
    # `default_type` (e não `add_header Content-Type`): add_header aqui anularia os cabeçalhos
    # de segurança do server e ainda duplicaria o Content-Type.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 512;
}
