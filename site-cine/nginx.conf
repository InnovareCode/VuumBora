server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Esta página é uma pasta só: um index.html e assets/. Sem build, sem
    # rotas geradas, então a resolução é a mais simples que existe.
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Health check do Easypanel e do rollback: não depende de nenhuma página,
    # só confirma que o nginx está de pé.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # O HTML, o CSS e o JS NÃO entram em cache longo de propósito: eles não
    # carregam hash no nome, então um cache agressivo faria a próxima
    # publicação demorar a aparecer para quem já visitou.
    location ~* \.(?:html|css|js)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # As imagens são o peso da página e não mudam de nome, mas também não
    # mudam de conteúdo: um dia de cache é seguro e poupa o 4G do visitante,
    # que é motorista no celular.
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 512;
}
