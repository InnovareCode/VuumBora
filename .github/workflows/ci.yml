name: CI

# Roda em todo PR e em todo push na main. O job final `ci-ok` e o UNICO que a
# protecao de branch precisa exigir: ele fica vermelho se qualquer outro falhar
# ou for pulado (ver docs/producao-passo-a-passo-dono.md, secao 1).
on:
  pull_request:
  push:
    # `fatia/**`: commit candidato de cada fatia (plano mestre, secao 4). A Iris valida o SHA da
    # branch e so depois ele entra na main; o CI tem de rodar antes do merge, nao so depois.
    branches: [main, 'fatia/**']
  schedule:
    # Segunda 07:00 UTC: reensaia backup/restauracao mesmo sem commit (o drill apodrece em silencio).
    - cron: '0 7 * * 1'
  workflow_dispatch:

# Um push novo no mesmo PR cancela a execucao anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PG_VERSION: '18'

jobs:
  check:
    name: check (fronteiras, contexto docker, typecheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # expo-env.d.ts e gerado pelo `expo start` e fica no .gitignore; sem ele o
      # typecheck dos apps nao enxerga os tipos do Expo (achado da Iris, S1).
      - name: Gerar expo-env.d.ts dos apps
        run: |
          for app in passenger driver; do
            printf '/// <reference types="expo/types" />\n' > "apps/$app/expo-env.d.ts"
          done
      - run: npm run check
      # Testes do cliente de identidade dos apps (sessao, refresh em voo unico, adaptadores mock e http).
      # Sem este passo, o pacote so teria o typecheck no CI.
      - name: Testes do api-client
        run: npm test -w @vuumbora/api-client
      # Maquina de estados da corrida (tabela inteira de transicoes e cancelamento por ator), fatia F08.
      - name: Testes do packages/domain
        run: npm test -w @vuumbora/domain
      # Cofre da sessao (primeira execucao e Keychain), SHA-256 do texto legal e UTF-8 estrito:
      # packages/ui/src/device. O `npm run check` so tipa estes testes.
      - name: Testes do packages/ui
        run: npm test -w @vuumbora/ui
      # nginx.conf nunca foi executado nesta maquina de desenvolvimento (sem nginx nem Docker).
      # Mesma imagem dos Dockerfiles; o arquivo entra onde eles o copiam. Pega erro de sintaxe e
      # de diretiva antes de o Easypanel tentar subir o contêiner (M-4, revisao-seguranca-s1-rodada3).
      - name: Validar nginx.conf do admin e do site (nginx -t)
        run: |
          set -eu
          for app in admin site; do
            echo "== nginx -t: apps/$app"
            docker run --rm -v "$PWD/apps/$app/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t
          done
      # F02/B4: o modo da identidade (mock/http) é escolhido por TROCA DE MÓDULO no metro.config.js
      # (resolver.resolveRequest redireciona "./mode" para "./mode.mock" ou "./mode.http"), não por um
      # `if` em runtime — um branch runtime não tira o código do mock do bundle (o minificador não prova
      # que é inalcançável). Com troca de módulo, o arquivo perdedor nunca entra no grafo de dependências,
      # e isso dá um canário de TEXTO que presta: o marcador de mode.mock.ts não pode aparecer no export
      # de produção. `expo export --platform web` de verdade (não só o typecheck) dos dois apps: 1 caso
      # positivo que tem de SAIR sem o canário do mock, e 2 controles negativos que têm de ABORTAR SEM
      # GERAR NADA (a pasta de saída existe, vazia — o Expo CLI a cria antes de carregar o
      # metro.config.js; "sem artefato" se prova listando-a, não por "pasta inexistente").
      - name: 'Apps: guarda de identidade e https na build de produção (expo export)'
        run: |
          set -eu
          HTTPS_URL="https://api.example.invalid"
          HTTP_URL="http://api.example.invalid"
          MOCK_CANARY="vuumbora-identity-mock-mode-canary-f02"
          for app in passenger driver; do
            DIR="apps/$app"
            OUT="$RUNNER_TEMP/export-$app"
            rm -rf "$OUT"

            echo "== $app: export de produção com EXPO_PUBLIC_API_URL https tem de SAIR, sem o canário do mock"
            (cd "$DIR" && VUUMBORA_BUILD_PROFILE=production EXPO_PUBLIC_API_URL="$HTTPS_URL" \
              npx expo export --platform web --output-dir "$OUT/ok")
            if [ -z "$(find "$OUT/ok" -type f 2>/dev/null)" ]; then
              echo "::error::$app: export de produção (https) não gerou nenhum arquivo"; exit 1
            fi
            if grep -rqF "$MOCK_CANARY" "$OUT/ok"; then
              echo "::error::$app: o canário do modo mock ('$MOCK_CANARY') apareceu no export de PRODUÇÃO — mode.mock.ts entrou no bundle"
              exit 1
            fi

            echo "== $app: controle negativo (EXPO_PUBLIC_API_URL em http) tem de ABORTAR sem gerar nada"
            set +e
            (cd "$DIR" && VUUMBORA_BUILD_PROFILE=production EXPO_PUBLIC_API_URL="$HTTP_URL" \
              npx expo export --platform web --output-dir "$OUT/http") >"$OUT.http.log" 2>&1
            http_status=$?
            set -e
            if [ "$http_status" -eq 0 ]; then
              echo "::error::$app: export de produção NÃO abortou com EXPO_PUBLIC_API_URL em http"; cat "$OUT.http.log"; exit 1
            fi
            grep -qi "https" "$OUT.http.log" || { echo "::error::$app: aborto de http não mencionou https"; cat "$OUT.http.log"; exit 1; }
            if [ -n "$(find "$OUT/http" -type f 2>/dev/null)" ]; then
              echo "::error::$app: controle negativo de http gerou arquivo(s) em vez de abortar vazio"; exit 1
            fi

            echo "== $app: controle negativo (resolver de identidade não apontando para mode.http) tem de ABORTAR sem gerar nada"
            cp "$DIR/metro.config.js" "$RUNNER_TEMP/metro.config.$app.bak"
            sed -i "s/if (profile === 'preview' || profile === 'production') return 'mode.http';/if (profile === 'preview' || profile === 'production') return 'mode.mock';/" "$DIR/metro.config.js"
            if ! grep -q "return 'mode.mock';" "$DIR/metro.config.js"; then
              echo "::error::$app: a mutação do controle negativo não encontrou a linha esperada em metro.config.js (arquivo mudou de forma?)"
              cp "$RUNNER_TEMP/metro.config.$app.bak" "$DIR/metro.config.js"
              exit 1
            fi
            set +e
            (cd "$DIR" && VUUMBORA_BUILD_PROFILE=production EXPO_PUBLIC_API_URL="$HTTPS_URL" \
              npx expo export --platform web --output-dir "$OUT/mock") >"$OUT.mock.log" 2>&1
            mock_status=$?
            set -e
            cp "$RUNNER_TEMP/metro.config.$app.bak" "$DIR/metro.config.js"
            if [ "$mock_status" -eq 0 ]; then
              echo "::error::$app: export de produção NÃO abortou com o resolver apontando para mode.mock"; cat "$OUT.mock.log"; exit 1
            fi
            grep -qi "simulada" "$OUT.mock.log" || { echo "::error::$app: aborto de identidade simulada não mencionou o motivo"; cat "$OUT.mock.log"; exit 1; }
            if [ -n "$(find "$OUT/mock" -type f 2>/dev/null)" ]; then
              echo "::error::$app: controle negativo de identidade simulada gerou arquivo(s) em vez de abortar vazio"; exit 1
            fi

            echo "== $app: controle negativo (perfil de release com expo export --dev) tem de ABORTAR sem gerar nada"
            set +e
            (cd "$DIR" && VUUMBORA_BUILD_PROFILE=production EXPO_PUBLIC_API_URL="$HTTPS_URL" \
              npx expo export --platform web --dev --output-dir "$OUT/devflag") >"$OUT.devflag.log" 2>&1
            devflag_status=$?
            set -e
            if [ "$devflag_status" -eq 0 ]; then
              echo "::error::$app: export de produção com --dev NÃO abortou (sairia com __DEV__ ligado)"; cat "$OUT.devflag.log"; exit 1
            fi
            grep -q "__DEV__" "$OUT.devflag.log" || { echo "::error::$app: aborto do --dev não mencionou __DEV__"; cat "$OUT.devflag.log"; exit 1; }
            if [ -n "$(find "$OUT/devflag" -type f 2>/dev/null)" ]; then
              echo "::error::$app: controle negativo do --dev gerou arquivo(s) em vez de abortar vazio"; exit 1
            fi

            echo "== $app: ok (export real + canário ausente + 3 controles negativos)"
          done

  api:
    name: api (build, migracoes e testes contra Postgres e Redis reais)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vuumbora
          POSTGRES_PASSWORD: ci-somente-teste
          POSTGRES_DB: vuumbora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vuumbora -d vuumbora_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://vuumbora:ci-somente-teste@localhost:5432/vuumbora_test
      REDIS_URL: redis://localhost:6379
      ALLOWED_ORIGINS: http://localhost:3000
      ADMIN_ALLOWED_ORIGINS: http://localhost:4310
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build da API
        run: npm run build --workspace @vuumbora/api

      - name: Migracoes reais contra o Postgres do servico
        run: npm run migrate --workspace @vuumbora/api

      - name: Subir a API e conferir /healthz (pega boot quebrado que o typecheck nao pega)
        run: |
          set -eu
          PORT=3100 npm run start --workspace @vuumbora/api >api.log 2>&1 &
          echo $! >api.pid
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3100/healthz | grep -q '"ok"'; then
              echo "healthz ok na tentativa $i"; exit 0
            fi
            sleep 1
          done
          echo "::error::API nao ficou saudavel em 30s"; cat api.log; exit 1
      - name: Parar a API
        if: always()
        run: kill "$(cat api.pid)" 2>/dev/null || true

      # Falha de proposito se o workspace nao tiver script `test`: "sem testes" nao pode
      # virar "testes verdes". Quando Iris acrescentar o script, este passo passa a rodar.
      - name: Testes do apps/api
        run: |
          set -eu
          if ! node -e "process.exit(require('./apps/api/package.json').scripts?.test ? 0 : 1)"; then
            echo "::error::apps/api/package.json nao tem script \"test\". Acrescente-o (ex.: node --test) antes de confiar neste CI."
            exit 1
          fi
          # Publica o nome dos testes que falharam como anotacao do GitHub: o log completo exige login
          # para ser lido por fora, e a anotacao aparece na pagina da execucao e na API publica.
          set +e
          npm test --workspace @vuumbora/api 2>&1 | tee api-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Bloco "failing tests:" do relatorio (mensagem da asserção e valores medidos), em UMA anotacao.
            clean=$(sed 's/\x1b\[[0-9;]*m//g' api-test.log)
            # O Node 22 do CI imprime TAP (o erro vem logo abaixo de cada "not ok"); o formato spec traz "failing tests:".
            block=$(printf '%s\n' "$clean" | grep -a -A14 -E '^\s*not ok' | head -80)
            [ -n "$block" ] || block=$(printf '%s\n' "$clean" | sed -n '/failing tests:/,$p' | head -60)
            [ -n "$block" ] || block=$(printf '%s\n' "$clean" | tail -40)
            echo "::error title=detalhe da falha::$(printf '%s' "$block" | sed ':a;N;$!ba;s/\n/%0A/g')"
            sed 's/\x1b\[[0-9;]*m//g' api-test.log | grep -E "✖|not ok" | sort -u | head -9 | while IFS= read -r line; do echo "::error::${line}"; done
            echo "::error::testes do apps/api falharam (exit ${status}); os nomes estao nas anotacoes acima"
          fi
          exit "$status"

  backup-drill:
    name: backup e restauracao (ensaio com contagem de linhas)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-somente-teste
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      # O cliente pre-instalado do runner e mais antigo que o servidor 18 e o pg_dump recusa.
      - name: Instalar cliente PostgreSQL ${{ env.PG_VERSION }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq "postgresql-client-${PG_VERSION}"
          echo "/usr/lib/postgresql/${PG_VERSION}/bin" >>"$GITHUB_PATH"
      - name: Ensaio de restauracao
        env:
          ADMIN_URL: postgres://postgres:ci-somente-teste@localhost:5432/postgres
        run: sh scripts/backup/drill-restore.sh

  # Unico check obrigatorio na protecao de branch. `if: always()` + conferencia de resultado
  # impede que um job pulado ou cancelado passe por verde.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [check, api, backup-drill]
    runs-on: ubuntu-24.04
    steps:
      - name: Todos os jobs precisam ter passado
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::ao menos um job falhou, foi cancelado ou pulado"; exit 1
          fi
